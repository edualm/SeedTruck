<!doctype html>
<!-- The search result image: a two-tone headline and the platforms over the torrent list's four transfers, staggered
     two by two on the icon's yellow with no device around them. The headline's second half is a dark gray,
     since white is too close to the yellow. Type matches screenshot-maker's: SF Pro Display Heavy at -0.055em.
     banners.sh renders it at 1920x1280. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1280px; overflow: hidden; }
  body {
    background: linear-gradient(150deg, #ffe45c 0%, #ffbf00 100%);
    font-family: "SF Pro Display", sans-serif;
  }
  h1 {
    position: absolute;
    top: 72px;
    width: 100%;
    margin: 0;
    text-align: center;
    font-size: 112px;
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: -0.055em;
    color: #000000;
  }
  h1 span { color: #545458; }
  p {
    position: absolute;
    top: 222px;
    width: 100%;
    margin: 0;
    text-align: center;
    font-size: 42px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: rgba(0, 0, 0, 0.6);
  }
  /* Two columns of two, the right column lower, each transfer turned a little. */
  img {
    position: absolute;
    left: 50%;
    top: 470px;
    width: 840px;
    margin-left: -420px;
    filter: drop-shadow(0 30px 50px rgba(120, 70, 0, 0.35)) drop-shadow(0 6px 12px rgba(0, 0, 0, 0.15));
  }
  img:nth-of-type(1) { transform: translate(-450px, 0) rotate(-3deg); }
  img:nth-of-type(2) { transform: translate(450px, 70px) rotate(2.5deg); }
  img:nth-of-type(3) { transform: translate(-450px, 315px) rotate(-2deg); }
  img:nth-of-type(4) { transform: translate(450px, 385px) rotate(3deg); }
</style>
<h1>Your seedbox. <span>Anywhere.</span></h1>
<p>iPhone · iPad · Mac · Apple Watch</p>
<img src="row-1.png" alt="">
<img src="row-2.png" alt="">
<img src="row-3.png" alt="">
<img src="row-4.png" alt="">
